worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Writable by the unprivileged nginx user.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path       /tmp/proxy_temp;
  fastcgi_temp_path     /tmp/fastcgi_temp;
  uwsgi_temp_path       /tmp/uwsgi_temp;
  scgi_temp_path        /tmp/scgi_temp;

  sendfile      on;
  tcp_nopush    on;
  server_tokens off;

  # Behind Nginx Proxy Manager: log the client IP, not the proxy's.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header   X-Forwarded-For;
  real_ip_recursive on;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /dev/stdout main;
  error_log  /dev/stderr warn;

  gzip              on;
  gzip_vary         on;
  gzip_min_length   1024;
  gzip_comp_level   6;
  gzip_proxied      any;
  gzip_types        text/plain text/css text/xml application/javascript
                    application/json image/svg+xml application/xml+rss;

  # The club service. One name, so the whole stack is still one published port.
  upstream club {
    server api:8000;
    keepalive 8;
  }

  server {
    listen      8080;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    charset utf-8;

    # TLS is terminated at NPM, so HSTS is set there, not here.
    add_header X-Content-Type-Options nosniff       always;
    add_header X-Frame-Options         SAMEORIGIN   always;
    add_header Referrer-Policy         strict-origin-when-cross-origin always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;

    # Container-internal healthcheck; not meant to be proxied publicly.
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    # `expires` rather than `add_header`: adding a header at this level would
    # reset the inherited security headers above, and these locations need them.

    # The page is a single hand-edited file — never let it go stale.
    location = /index.html {
      expires -1;
    }

    # Photography changes only on deploy; a week is safe and cheap.
    location /images/ {
      expires 7d;
    }

    # The webfont is versioned by name and never edited in place. No CORS
    # header: it is same-origin, and adding one here would reset the inherited
    # security headers for this location.
    location /fonts/ {
      expires 1y;
    }

    # ── the club service ──
    # Everything that is not the static site goes to the API: the request form,
    # the member's offer pages, the payment webhook and the cellar desk.
    location ~ ^/(api|club)/ {
      proxy_pass         http://club;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";
      proxy_read_timeout 30s;
      # Stripe signs the exact bytes it sent; buffering is fine, rewriting is not.
      proxy_request_buffering on;
      client_max_body_size 256k;
    }

    # The desk is staff-only. Restrict it by address here as well as by the
    # password the service asks for — two locks, not one.
    location /admin {
      # allow 203.0.113.0/24;   # the winery's office
      # deny all;
      proxy_pass         http://club;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";
      proxy_read_timeout 30s;
    }

    location / {
      try_files $uri $uri/ =404;
    }

    # Unknown paths get the landing page as a body, but an honest 404 status —
    # serving 200 for everything would let search engines index phantom URLs.
    error_page 404 /index.html;
  }
}
